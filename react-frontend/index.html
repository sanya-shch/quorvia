<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The theme before the first paint, so the page never flashes the wrong one. Keep in step with
      // src/theme/theme.ts (the storage key; the public form is pinned to the light theme).
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem("quorvia-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          root.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
        if (/^\/public\/forms\//.test(location.pathname)) root.dataset.themeLock = "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quorvia is a survey builder with conditional logic, multiple question types, content translations and built-in analytics."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quorvia: survey builder with conditional logic" />
    <meta
      property="og:description"
      content="Build dynamic surveys with conditional flows, scoring, translations and funnel analytics."
    />
    <title>Quorvia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
