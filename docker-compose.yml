name: quorvia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quorvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quorvia}
      POSTGRES_DB: ${POSTGRES_DB:-quorvia}
    ports:
      # Loopback only: without 127.0.0.1 Docker publishes the port on ALL interfaces
      # (with the default password that is an open DB on a shared Wi-Fi network).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quorvia} -d ${POSTGRES_DB:-quorvia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
